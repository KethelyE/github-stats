name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=KethelyE&show_icons=true&include_all_commits=true
          path: generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=KethelyE&layout=compact&langs_count=8
          path: generated/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git commit -m "chore: update github stats" || exit 0
          git push
